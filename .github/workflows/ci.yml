# Cross-platform verification of both the renderer-dependent build and headless logic tests.
name: C++ build and tests

on:
  push:
  pull_request:

jobs:
  # Windows validates the primary desktop release environment.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -j 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  # Linux additionally installs the native OpenGL/X11 headers raylib requires to compile.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install raylib system prerequisites
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
